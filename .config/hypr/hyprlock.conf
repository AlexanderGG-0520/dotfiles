general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.20
    vibrancy_darkness = 0.40
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(88, 166, 255, 0.75)
    inner_color = rgba(11, 15, 25, 0.88)
    font_color = rgba(242, 245, 248, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(242, 245, 248, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%Y-%m-%d  %A"
    color = rgba(192, 200, 210, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}
