# ===== Alex dropdown terminal =====
workspace = special:term, gapsout:80, on-created-empty:kitty --class dropdown-terminal

windowrule {
    name = alex-dropdown-terminal
    float = 1
    size = 1100 620
    center = 1
    opacity = 0.96
    rounding = 18
    match:class = ^(dropdown-terminal)$
}

bind = $mainMod, grave, togglespecialworkspace, term

# ===== Alex screenshot keybinds =====
# Area screenshot to clipboard
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Area screenshot to file
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png

# Fullscreen screenshot to file
bind = CTRL, Print, exec, grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png

# Area screenshot and open editor
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | swappy -f -

# ===== Alex recording keybinds =====
# Area recording
bind = $mainMod SHIFT, R, exec, pkill -INT wf-recorder || wf-recorder -g "$(slurp)" -f ~/Videos/Recordings/recording-$(date +%Y%m%d-%H%M%S).mp4

# Fullscreen recording
bind = $mainMod CTRL, R, exec, pkill -INT wf-recorder || wf-recorder -f ~/Videos/Recordings/recording-$(date +%Y%m%d-%H%M%S).mp4

# ===== Alex recording keybinds fixed =====
# Record DP-2 fullscreen
# bind = $mainMod CTRL, R, exec, pkill -INT wf-recorder || wf-recorder -o DP-2 -f ~/Videos/Recordings/recording-DP-2-$(date +%Y%m%d-%H%M%S).mp4

# Record area inside DP-2
# bind = $mainMod SHIFT, R, exec, pkill -INT wf-recorder || wf-recorder -o DP-2 -g "$(slurp)" -f ~/Videos/Recordings/recording-area-DP-2-$(date +%Y%m%d-%H%M%S).mp4

# ===== Alex audio recording keybinds =====
# Record DP-2 fullscreen with desktop audio
bind = $mainMod CTRL, R, exec, pkill -INT wf-recorder || wf-recorder -o DP-2 -a $WF_RECORDER_AUDIO_SOURCE -f ~/Videos/Recordings/recording-DP-2-audio-$(date +%Y%m%d-%H%M%S).mp4

# Record area inside DP-2 with desktop audio
bind = $mainMod SHIFT, R, exec, pkill -INT wf-recorder || wf-recorder -o DP-2 -a $WF_RECORDER_AUDIO_SOURCE -g "$(slurp)" -f ~/Videos/Recordings/recording-area-DP-2-audio-$(date +%Y%m%d-%H%M%S).mp4

# Ghostty warm single instance
# disabled ghostty exec-once = ghostty --gtk-single-instance=true --quit-after-last-window-closed=false --initial-window=false

# ===== Alex recorder scripts =====
bind = $mainMod CTRL, R, exec, ~/.local/bin/record-dp1
bind = $mainMod SHIFT, R, exec, ~/.local/bin/record-area-dp1
